<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLLOW SIGNAL</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    
    <!-- OVERWORLD -->
    <div id="overworld" class="screen">
        <canvas id="overworld-canvas"></canvas>
        <div id="overworld-ui">
            <div class="stat-bar">
                <span class="label">INTEGRITY</span>
                <div class="bar"><div id="overworld-hp" class="bar-fill"></div></div>
            </div>
        </div>
    </div>

    <!-- DIALOGUE BOX -->
    <div id="dialogue-box" class="hidden">
        <div id="dialogue-text"></div>
        <div id="dialogue-prompt">▼</div>
    </div>

    <!-- COMBAT SCREEN -->
    <div id="combat" class="screen hidden">
        <div class="combat-top">
            <div id="enemy-name"></div>
            <div id="enemy-visual"></div>
        </div>
        
        <div class="combat-middle">
            <div id="battle-box">
                <div id="soul"></div>
            </div>
        </div>
        
        <div class="combat-bottom">
            <div id="combat-ui">
                <div class="stats">
                    <span class="player-name">RECEIVER</span>
                    <span class="hp-display">
                        <span class="label">INTEGRITY</span>
                        <span id="hp-current">100</span> / <span id="hp-max">100</span>
                    </span>
                </div>
                <div id="combat-menu" class="menu">
                    <div class="menu-option" data-action="SIGNAL">* SIGNAL</div>
                    <div class="menu-option" data-action="LISTEN">* LISTEN</div>
                    <div class="menu-option" data-action="DISRUPT">* DISRUPT</div>
                    <div class="menu-option" data-action="WITHDRAW">* WITHDRAW</div>
                </div>
                <div id="action-menu" class="menu hidden"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
