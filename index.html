<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header>
            <h1 class="glitch" data-text="ARCADE HUB">ARCADE HUB</h1>
            <p class="subtitle">SELECT YOUR ADVENTURE</p>
        </header>

        <main class="game-grid">
            <button class="game-card" id="game-1">
                <div class="card-content">
                    <span class="game-number">01</span>
                    <h2 class="game-title">COMING SOON</h2>
                    <div class="status">LOCKED</div>
                </div>
            </button>
            <button class="game-card" id="game-2" onclick="window.location.href='FREEZE INDICATOR/index.html'">
                <div class="card-content">
                    <span class="game-number">02</span>
                    <h2 class="game-title">FREEZE INDICATOR</h2>
                    <div class="status">ONLINE</div>
                </div>
            </button>
            <button class="game-card" id="game-3">
                <div class="card-content">
                    <span class="game-number">03</span>
                    <h2 class="game-title">COMING SOON</h2>
                    <div class="status">LOCKED</div>
                </div>
            </button>
            <button class="game-card" id="game-4">
                <div class="card-content">
                    <span class="game-number">04</span>
                    <h2 class="game-title">COMING SOON</h2>
                    <div class="status">LOCKED</div>
                </div>
            </button>
            <button class="game-card" id="game-5">
                <div class="card-content">
                    <span class="game-number">05</span>
                    <h2 class="game-title">COMING SOON</h2>
                    <div class="status">LOCKED</div>
                </div>
            </button>
        </main>

        <footer>
            <p>&copy; 2026 Arcade Hub - Insert Coin to Continue</p>
        </footer>
    </div>
</body>
</html>
